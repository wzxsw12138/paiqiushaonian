<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6e9">
<title>测一测｜你对应《排球少年》里的哪一位</title>
<style>
:root{
  --ink:#211d1a;
  --paper:#fdf6e9;
  --orange:#ff8c42;
  --orange2:#ff6b3d;
  --yellow:#ffd36e;
  --sky:#8ecff5;
  --pink:#ffb5c2;
  --mint:#a8ddc8;
  --violet:#b8a7e8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background-color:#fdf6e9;
  background-image:radial-gradient(rgba(33,29,26,.10) 1.1px,transparent 1.1px);
  background-size:13px 13px;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 460px at 16% -12%,#ffe2c6 0%,transparent 58%),
    radial-gradient(760px 420px at 98% 2%,#d9ecff 0%,transparent 60%),
    radial-gradient(720px 440px at 50% 110%,#ffdfe6 0%,transparent 58%);
}
.stage{
  position:relative;z-index:1;
  max-width:580px;margin:0 auto;
  padding:clamp(16px,4vw,28px) clamp(14px,4.2vw,26px) 46px;
  min-height:100vh;
}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .42s cubic-bezier(.2,.9,.3,1) both}
#screen-intro.active{display:flex;align-items:center;min-height:calc(100vh - 60px)}
#screen-intro .intro{width:100%;min-width:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- 通用组件 ---------- */
.badge{
  display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:99px;
  padding:6px 14px;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:3px solid var(--ink);border-radius:15px;
  background:var(--orange);color:var(--ink);
  font-family:inherit;font-weight:900;font-size:16px;padding:14px 24px;
  box-shadow:6px 6px 0 var(--ink);cursor:pointer;
  transition:transform .13s,box-shadow .13s,background .13s;
}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.big{width:100%;font-size:18px;padding:18px;border-radius:18px}

/* ---------- 启动页 ---------- */
.intro{text-align:left;padding-top:8px}
.title{margin:20px 0 0;font-weight:900;line-height:1.02;letter-spacing:-.02em}
.title .l1{display:block;font-size:clamp(46px,13.5vw,66px)}
.title .l2{display:block;font-size:clamp(21px,6.2vw,29px);margin-top:6px}
.title .l3{display:block;font-size:clamp(34px,10vw,50px);margin-top:2px}
.title .l3 em{
  font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%);
  padding:0 4px;
}
.lead{
  margin:18px 0 0;font-size:15px;line-height:1.85;color:#4d4640;max-width:24em;font-weight:500;
}
.lead b{color:var(--ink);background:linear-gradient(transparent 60%,#ffe0c4 60%)}
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 4px}
.roster .mini{
  min-width:0;background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  box-shadow:4px 4px 0 rgba(33,29,26,.85);padding:8px;text-align:center;
  transform:rotate(var(--r,0deg));
}
.roster .mini img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:50%;border:2px solid rgba(33,29,26,.25)}
.roster .mini span{font-size:11px;font-weight:800;display:block;margin-top:6px;color:#5a5450}
.roster .more{
  min-width:0;border:2.5px dashed rgba(33,29,26,.45);border-radius:16px;display:flex;
  align-items:center;justify-content:center;text-align:center;
  font-size:12px;font-weight:800;color:#6d665f;line-height:1.5;padding:8px;
}
.start-wrap{margin-top:26px}
.tips{margin-top:14px;font-size:12.5px;color:#7d756d;font-weight:600;text-align:center}

/* ---------- 答题页 ---------- */
.quiz-head{
  position:sticky;top:0;z-index:5;
  padding:8px 0 12px;
  background:linear-gradient(#fdf6e9 62%,rgba(253,246,233,0));
}
.head-row{display:flex;align-items:center;gap:12px}
.progress{
  flex:1;height:13px;border:2.5px solid var(--ink);border-radius:99px;
  background:#fff;overflow:hidden;
}
.progress i{
  display:block;height:100%;width:0;border-radius:99px;
  background:repeating-linear-gradient(45deg,var(--orange) 0,var(--orange) 7px,var(--yellow) 7px,var(--yellow) 14px);
  transition:width .4s cubic-bezier(.2,.9,.3,1);
}
.counter{font-size:13px;font-weight:900;letter-spacing:.04em;min-width:62px;text-align:right}
.counter b{font-size:19px;color:var(--orange2)}
.card{
  background:#fff;border:3px solid var(--ink);border-radius:20px;
  padding:20px 17px 14px;box-shadow:7px 7px 0 rgba(33,29,26,.9);
  animation:cardIn .36s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) rotate(-.8deg)}to{opacity:1;transform:none}}
.q-no{
  display:inline-block;background:var(--ink);color:#fff;font-size:12px;
  font-weight:900;padding:3px 10px;border-radius:8px;letter-spacing:.1em;
}
.q-title{
  margin:12px 0 16px;font-size:clamp(17px,4.6vw,20px);line-height:1.55;font-weight:800;
}
.opts{display:block}
.opt{
  display:flex;align-items:center;gap:11px;
  background:#fff;border:2.5px solid var(--ink);border-radius:14px;
  padding:13px 14px;margin-bottom:10px;cursor:pointer;
  font-size:15px;line-height:1.45;font-weight:600;
  box-shadow:3px 3px 0 rgba(33,29,26,.82);
  transition:transform .15s,box-shadow .15s,background .15s;
  position:relative;
}
.opt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:#fffaf0}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.sel{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mark{
  flex:0 0 26px;width:26px;height:26px;border-radius:50%;
  border:2.2px solid var(--ink);background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:900;
}
.opt.sel .mark{background:var(--ink);color:#fff}
.txt{flex:1}
.tick{
  flex:0 0 auto;width:20px;text-align:center;font-weight:900;
  color:var(--ink);opacity:0;transform:scale(.4) rotate(-20deg);
  transition:opacity .18s,transform .28s cubic-bezier(.2,.9,.3,1.5);
}
.opt.sel .tick{opacity:1;transform:scale(1) rotate(0)}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:4px;padding-top:8px;
}
.link{
  border:none;background:none;font-family:inherit;font-size:13px;
  font-weight:800;color:#6d665f;cursor:pointer;padding:6px 0;
}
.link:disabled{opacity:.3;cursor:default}
.hint{font-size:12px;color:#8d857d;font-weight:600}

/* ---------- 扫描页 ---------- */
.scanning{text-align:center;padding:44px 20px}
.ball{width:64px;height:64px;margin:0 auto 20px;animation:spin 1.1s linear infinite}
.ball svg{width:100%;height:100%;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.scanning p{font-size:15px;font-weight:800;margin:0}
.scanning small{display:block;margin-top:8px;font-size:12.5px;color:#8d857d;font-weight:600}

/* ---------- 结果页 ---------- */
.res-hero{display:flex;align-items:center;gap:15px;margin-bottom:14px}
.ava-wrap{position:relative;flex:0 0 clamp(112px,31vw,142px)}
.ava{
  width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;
  border:3px solid var(--ink);background:#fff;
  box-shadow:6px 6px 0 var(--ink);transform:rotate(-2.5deg);
}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.match{
  position:absolute;right:-8px;bottom:-6px;
  background:var(--yellow);border:2.5px solid var(--ink);border-radius:10px;
  font-size:11px;font-weight:900;padding:3px 7px;transform:rotate(-5deg);
  box-shadow:2px 2px 0 rgba(33,29,26,.8);
}
.res-meta{flex:1;min-width:0}
.kicker{
  font-size:12px;font-weight:900;letter-spacing:.12em;color:#8d857d;
}
.res-name{
  margin:4px 0 4px;font-size:clamp(27px,8.4vw,38px);font-weight:900;line-height:1.1;letter-spacing:-.02em;
}
.res-team{font-size:12.5px;font-weight:800;color:#6d665f;margin-top:9px}
.res-team em{
  font-style:normal;background:var(--ink);color:#fff;padding:2px 7px;border-radius:6px;margin-right:6px;
}
.slogan{
  background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;
  font-size:15.5px;font-weight:800;line-height:1.5;
  transform:rotate(-1deg);box-shadow:5px 5px 0 rgba(255,140,66,.9);
  margin:16px 0 4px;
}
.block{
  background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:14px 16px;margin-top:12px;box-shadow:4px 4px 0 rgba(33,29,26,.85);
}
.block h3{
  display:flex;align-items:center;gap:8px;
  margin:0 0 8px;font-size:13.5px;font-weight:900;letter-spacing:.02em;
}
.block h3::before{
  content:"";width:9px;height:9px;background:var(--orange);
  border:2px solid var(--ink);transform:rotate(45deg);flex:0 0 auto;
}
.block p{margin:0;font-size:14.5px;line-height:1.85;color:#3a3531;font-weight:500}
.dim-row{display:flex;align-items:center;gap:9px;margin:8px 0;font-size:12.5px;font-weight:800}
.dim-name{flex:0 0 62px;color:#514b46}
.dim-bar{flex:1;height:11px;border:2px solid var(--ink);border-radius:99px;background:#f4ece0;overflow:hidden}
.dim-bar i{display:block;height:100%;width:0;transition:width .85s cubic-bezier(.2,.9,.3,1)}
.dim-val{flex:0 0 34px;text-align:right;font-size:11.5px;color:#6d665f}
.near{
  margin-top:12px;font-size:12.5px;font-weight:700;color:#6d665f;
  background:#fff;border:2px dashed rgba(33,29,26,.4);border-radius:12px;
  padding:9px 13px;
}
.near b{color:var(--orange2)}
.actions{display:grid;gap:10px;margin-top:18px}
.foot{
  margin-top:20px;text-align:center;font-size:11.5px;color:#8d857d;font-weight:600;line-height:1.7;
}

/* ---------- 提示条 ---------- */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:800;
  padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:50;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  .res-hero{gap:11px}
  .block p{font-size:14px}
  .opt{font-size:14.5px;padding:12px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="stage">

  <!-- ========== 视图：启动页 ========== -->
  <section id="screen-intro" class="screen active">
    <div class="intro">
      <div class="badge">趣味人格小测 · 24 题</div>
      <h1 class="title">
        <span class="l1">测一测</span>
        <span class="l2">你对应《排球少年》里的</span>
        <span class="l3"><em>哪一位？</em></span>
      </h1>
      <p class="lead">
        不考动漫知识，也不考排球常识。<br>
        24 个<span id="leadHl">日常小场景</span>，凭第一反应选就行——<br>
        测的是你身上那股<b>藏不住的劲儿</b>。
      </p>

      <div class="roster" id="roster"></div>

      <div class="start-wrap">
        <button class="btn big" id="startBtn">开始测试 <span>→</span></button>
      </div>
      <p class="tips">约 3 分钟 · 没有标准答案 · 做完直接出结果</p>
    </div>
  </section>

  <!-- ========== 视图：答题页 ========== -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-head">
      <div class="head-row">
        <div class="progress"><i id="bar"></i></div>
        <div class="counter"><b id="curNum">1</b> / 24</div>
      </div>
    </div>
    <div id="qArea"></div>
  </section>

  <!-- ========== 视图：结果页 ========== -->
  <section id="screen-result" class="screen">
    <div id="resultArea"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 维度定义
   h 热血 / c 冷静 / e 共情 / d 胜负欲 / s 细腻 / f 自由
   ========================================================= */
const DIMS = ['h','c','e','d','s','f'];
const DIM_NAME = {h:'热血指数',c:'冷静指数',e:'共情指数',d:'胜负欲',s:'细腻度',f:'自由值'};
const DIM_COLOR = {h:'#ff8c42',c:'#8ecff5',e:'#ffb5c2',d:'#ffd36e',s:'#b8a7e8',f:'#a8ddc8'};

/* =========================================================
   2. 题库（24 题 · 全部生活场景 / 超现实 / 反事实 / 规则怪谈）
   ========================================================= */
const QUESTIONS = [
{q:'手机只剩 1% 电，你还是点开了——',o:[
  {t:'那个没发完的聊天框，话得说完',s:{e:2,f:1}},
  {t:'运动 App，今天的记录不能断',s:{h:2,d:1}},
  {t:'备忘录，把明天的事再理一遍',s:{c:2,d:1}},
  {t:'随便一个视频，能看一秒是一秒',s:{f:2,s:1}}]},

{q:'搬家只能先把一样东西装箱，你抓的是——',o:[
  {t:'那双一直没舍得穿的鞋',s:{h:2,d:1}},
  {t:'那本写满计划的笔记',s:{c:2,d:1}},
  {t:'朋友送的、很丑但很重要的东西',s:{e:2,s:1}},
  {t:'一箱「说不定以后有用」的小玩意',s:{f:2,s:1}}]},

{q:'一觉醒来，你能听见别人心里的下一句话。你会——',o:[
  {t:'立刻找人试试，看是不是真的',s:{h:2,f:1}},
  {t:'先记下来，慢慢找规律',s:{c:2,s:1}},
  {t:'只在在意的人身上用',s:{e:2,s:1}},
  {t:'太吵了，想办法把它关掉',s:{c:1,f:1,s:1}}]},

{q:'如果明天起全世界放假一整年——',o:[
  {t:'太好了，终于能天天动起来',s:{h:2,f:1}},
  {t:'先拉个表，把这一年规划掉',s:{c:2,d:1}},
  {t:'把所有人叫上，一起干点什么',s:{e:2,h:1}},
  {t:'什么都不干，先躺三天',s:{f:2,c:1}}]},

{q:'你误入一层「所有门都必须敲三下」的楼——',o:[
  {t:'敲得又响又快，看谁先撑不住',s:{h:2,f:1}},
  {t:'认真地数，严格三下，不多不少',s:{c:2,d:1}},
  {t:'帮别人数着，提醒他们别敲错',s:{e:2,s:1}},
  {t:'偷偷试一次敲两下，看会怎样',s:{f:2,c:1}}]},

{q:'书桌上最不能少的东西是——',o:[
  {t:'一个能捏能扔的东西',s:{h:2,d:1}},
  {t:'一支笔和一张纸',s:{c:2,d:1}},
  {t:'一张和别人的合照',s:{e:2,s:1}},
  {t:'几个没用但很好看的小摆件',s:{f:2,s:1}}]},

{q:'组队打游戏，你总是自动变成——',o:[
  {t:'冲在最前面的那个',s:{h:2,d:1}},
  {t:'在后面算血量算伤害的那个',s:{c:2,d:1}},
  {t:'一直问「你还好吗」的那个',s:{e:2,s:1}},
  {t:'打到一半跑去做别的的那个',s:{f:2,h:1}}]},

{q:'「他明明可以不管的，但他还是——」你会怎么接——',o:[
  {t:'冲了上去',s:{h:2,d:1}},
  {t:'先想清楚，再动手',s:{c:2,d:1}},
  {t:'把所有人都一起拉上了',s:{e:2,h:1}},
  {t:'用了一个谁也想不到的办法',s:{f:2,c:1}}]},

{q:'有一个「重来一次」的按钮，只能用一次，你会用在——',o:[
  {t:'那场差一点就赢的比赛',s:{d:2,h:1}},
  {t:'那句说错了的话',s:{s:2,e:1}},
  {t:'那个没留住的人',s:{e:2,s:1}},
  {t:'不用，现在这样也挺好',s:{f:2,c:1}}]},

{q:'一天里只能保留一件事，你留下——',o:[
  {t:'出门去运动',s:{h:2,d:1}},
  {t:'把手上的事做完',s:{c:2,d:1}},
  {t:'和重要的人待在一起',s:{e:2,s:1}},
  {t:'那件一直想做、看起来没用的事',s:{f:2,s:1}}]},

{q:'一觉醒来，你多了个完全听话的分身，你让它去——',o:[
  {t:'替我去上班／上学，把活干完',s:{c:2,d:1}},
  {t:'替我去运动，把身体练起来',s:{h:2,d:1}},
  {t:'替我去陪陪该陪的人',s:{e:2,s:1}},
  {t:'替我去做那件一直没开始的事',s:{f:2,h:1}}]},


{q:'规定午休必须闭眼二十分钟，你会——',o:[
  {t:'一秒入睡，睡得理直气壮',s:{f:2,c:1}},
  {t:'闭着眼，脑子在排练下午的事',s:{d:2,c:1}},
  {t:'偷偷瞄旁边的人睡着没',s:{s:2,e:1}},
  {t:'闭着眼编故事，越想越精神',s:{f:2,s:1}}]},

{q:'如果要用一种天气形容自己，你选——',o:[
  {t:'大晴天，晒得人睁不开眼',s:{h:2,f:1}},
  {t:'阴天，很安静，但压着点什么',s:{c:2,s:1}},
  {t:'小雨，落在谁身上都刚刚好',s:{e:2,s:1}},
  {t:'龙卷风，说来就来',s:{f:2,h:1}}]},

{q:'给队友加 buff，你会把点加在——',o:[
  {t:'体力',s:{h:2,e:1}},
  {t:'判断力',s:{c:2,d:1}},
  {t:'心情和士气',s:{e:2,h:1}},
  {t:'想象力',s:{f:2,c:1}}]},

{q:'朋友说「你这个人啊，就是——」，你希望后半句是——',o:[
  {t:'太拼了',s:{d:2,h:1}},
  {t:'想太多了',s:{s:2,c:1}},
  {t:'太好了',s:{e:2,s:1}},
  {t:'太怪了',s:{f:2,h:1}}]},

{q:'如果能回到高一开学第一天——',o:[
  {t:'直接去球场或社团报名',s:{h:2,d:1}},
  {t:'先摸清这届谁最厉害',s:{c:2,d:1}},
  {t:'先认识一个能一起吃饭的人',s:{e:2,s:1}},
  {t:'什么都不改，再来一次也挺好',s:{f:2,c:1}}]},

{q:'只能保留一段「失败」的经历，你留——',o:[
  {t:'差一点就赢的那次',s:{d:2,h:1}},
  {t:'搞砸了但学到东西的那次',s:{c:2,d:1}},
  {t:'和别人一起崩掉的那次',s:{e:2,s:1}},
  {t:'莫名其妙失败但很好笑的那次',s:{f:2,s:1}}]},

{q:'你能看见每个人头顶的状态条，你最先看——',o:[
  {t:'谁在兴奋',s:{h:2,d:1}},
  {t:'谁在硬撑',s:{s:2,e:1}},

function renderQ(){
  const q = QUESTIONS[cur];
  const sel = answers[cur];
  qArea.innerHTML = `
    <div class="card">
      <span class="q-no">Q${String(cur + 1).padStart(2, '0')}</span>
      <h2 class="q-title">${q.q}</h2>
      <div class="opts">
        ${q.o.map((o, i) => `
          <div class="opt${sel === i ? ' sel' : ''}" data-i="${i}">
            <span class="mark">${'ABCD'[i]}</span>
            <span class="txt">${o.t}</span>
            <span class="tick">✓</span>
          </div>`).join('')}
      </div>
      <div class="card-foot">
        <button class="link" id="backBtn" ${cur === 0 ? 'disabled' : ''}>← 上一题</button>
        <span class="hint">凭第一反应选，不用纠结</span>
      </div>
    </div>`;
  bar.style.width = ((cur + 1) / QUESTIONS.length * 100) + '%';
  curNum.textContent = cur + 1;
}

qArea.addEventListener('click', function (e){
  const backBtn = e.target.closest('#backBtn');
  if (backBtn){
    if (cur > 0){ cur--; renderQ(); }
    return;
  }
  const opt = e.target.closest('.opt');
  if (!opt || locked) return;

  const i = Number(opt.dataset.i);
  answers[cur] = i;
  locked = true;

  qArea.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
  opt.classList.add('sel');

  setTimeout(function (){
    locked = false;
    if (cur < QUESTIONS.length - 1){
      cur++;
      renderQ();
    } else {
      finish();
    }
  }, cur === QUESTIONS.length - 1 ? 420 : 250);
});

/* =========================================================
   6. 计分与匹配
   ========================================================= */
// 角色校准偏置：让 13 位选手的命中概率更均衡
const BIAS = [-0.152,0.033,-0.189,0.074,-0.112,0.105,0.283,-0.058,-0.086,0.212,-0.080,0.016,-0.047];

function zScore(obj){
  const vals = DIMS.map(d => obj[d]);
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const sd = Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / vals.length) || 1;
  const out = {};
  DIMS.forEach((d, i) => out[d] = (vals[i] - mean) / sd);
  return out;
}

function calcResult(){
  const user = {h:0,c:0,e:0,d:0,s:0,f:0};
  answers.forEach((ai, qi) => {
    const sc = QUESTIONS[qi].o[ai].s;
    for (const k in sc) user[k] += sc[k];
  });

  // 每个维度的理论最高分
  const maxv = {};
  DIMS.forEach(d => {
    let m = 0;
    QUESTIONS.forEach(q => {
      let qm = 0;
      q.o.forEach(o => { qm = Math.max(qm, o.s[d] || 0); });
      m += qm;
    });
    maxv[d] = m || 1;
  });

  const raw = {};
  DIMS.forEach(d => raw[d] = user[d] / maxv[d]);

  // 标准化：只看"相对强项"，避免中庸型向量占便宜
  const uz0 = zScore(raw);
  const uLen = Math.sqrt(DIMS.reduce((a, d) => a + uz0[d] * uz0[d], 0)) || 1;
  const uz = {};
  DIMS.forEach(d => uz[d] = uz0[d] / uLen);

  const scored = PEOPLE.map((p, idx) => {
    const pz0 = zScore(p.v);
    const pLen = Math.sqrt(DIMS.reduce((a, d) => a + pz0[d] * pz0[d], 0)) || 1;
    let cos = 0;
    DIMS.forEach(d => cos += uz[d] * (pz0[d] / pLen));
    return {p, cos, score: cos - BIAS[idx]};
  }).sort((a, b) => b.score - a.score);

  return {best: scored[0], second: scored[1], raw};
}

function showResult(){
  const {best, second, raw} = calcResult();
  const p = best.p;
  const matchPct = Math.min(97, Math.max(87, Math.round(best.cos * 40 + 65)));
  const maxRaw = Math.max(...DIMS.map(d => raw[d])) || 1;
  const pct = {};
  DIMS.forEach(d => pct[d] = Math.round(28 + raw[d] / maxRaw * 72));

  resultArea.innerHTML = `
    <div class="res-hero">
      <div class="ava-wrap">
        <div class="ava">${avatarHTML(p)}</div>
        <div class="match">匹配 ${matchPct}%</div>

        <h2 class="res-name">${p.name}</h2>

      </div>
    </div>

    <div class="slogan">「${p.slogan}」</div>

    <div class="block">

    </div>

    </div>

    <p class="foot">趣味性格匹配 · 只聊气质与行事风格，不评判对错<br>角色形象为《排球少年》动画截图 · 仅作趣味测试配图</p>
  `;

  switchScreen(screenResult);

    });
  }, 120);

  const shareText = `我测出来是「${p.name}」！\n「${p.slogan}」\n你是《排球少年》里的哪一位？来对一下～\n#人格测试 #排球少年`;

  document.getElementById('shareBtn').addEventListener('click', function (){
    copyText(shareText);
  });
  document.getElementById('retryBtn').addEventListener('click', function (){
    cur = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    locked = false;
    renderQ();
    switchScreen(screenIntro);
  });
}

/* 复制 + 提示 */
function copyText(text){
  const done = function (){ toast('已复制，快去发群里'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function (){ legacyCopy(text, done); });
  } else {
    legacyCopy(text, done);
  }
}
function legacyCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
  cb();
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2000);
}

/* =========================================================
   7. 启动
   ========================================================= */
document.getElementById('startBtn').addEventListener('click', function (){
  cur = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  locked = false;
  renderQ();
  switchScreen(screenQuiz);
});
</script>
